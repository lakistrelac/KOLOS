<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#eefbd5 0,transparent 24%),radial-gradient(circle at 92% 4%,#eceaff 0,transparent 25%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.wrap{width:min(1180px,calc(100% - 34px));margin:auto}.nav{position:sticky;top:0;z-index:10;background:rgba(247,245,238,.84);backdrop-filter:blur(16px);border-bottom:1px solid rgba(222,223,215,.8)}.navin{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center}.brandLogo{display:block;width:146px;height:auto}.mark{display:none}.navlinks{display:flex;gap:24px;color:#565b54;font-weight:800;font-size:14px}.navlinks a{color:inherit;text-decoration:none}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900}.primary{background:var(--ink);color:#fff}.accent{background:var(--accent);color:var(--ink)}

.rankShowcase{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.rankGroup{--rc:#ddd;--ri:#333;--rs:#f4f4f0;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:25px;padding:16px;box-shadow:0 10px 28px rgba(20,22,18,.05)}.rankGroup.current{outline:3px solid var(--accent);outline-offset:-3px}.rankGroup.apex{background:linear-gradient(180deg,#161915 0,#21261d 100%);border-color:#31382c;box-shadow:0 16px 36px rgba(20,22,18,.16)}.rankGroup.apex .rankHead2 h3,.rankGroup.apex .rankCode,.rankGroup.apex .xpLine,.rankGroup.apex .tierFoot,.rankGroup.apex .tierCap{color:#eef8d8}.rankGroup.apex .rankCode{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}.rankGroup.apex .tier2{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}.rankGroup.apex .tier2.high{background:linear-gradient(150deg,rgba(255,255,255,.12) 0,rgba(255,255,255,.04) 100%);box-shadow:inset 0 0 0 2px var(--rc),0 9px 20px rgba(0,0,0,.16)}.rankGroup.apex .insignia svg{filter:drop-shadow(0 8px 12px rgba(0,0,0,.28))}.rankHead2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.rankHead2 h3{margin:0;font-size:20px;letter-spacing:-.03em}.rankCode{font-size:10px;font-weight:950;letter-spacing:.1em;color:var(--ri);padding:5px 8px;border-radius:999px;background:var(--rs);border:1px solid color-mix(in srgb,var(--rc) 70%,white)}.rankPair2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tier2{position:relative;min-height:188px;border-radius:19px;padding:12px;background:var(--rs);border:1px solid rgba(18,20,17,.08);overflow:hidden;display:flex;flex-direction:column}.tier2.high{background:linear-gradient(150deg,#fff 0,var(--rs) 100%);box-shadow:inset 0 0 0 2px var(--rc),0 9px 20px rgba(20,22,18,.05)}.tier2.active{outline:2px solid var(--rc);outline-offset:-2px}.tierCap{display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:1000;letter-spacing:.08em;color:var(--ri);marg .appShell{display:grid;grid-template-columns:240px 1fr;gap:20px;min-height:700px}.sidebar,.panel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.sidebar{padding:22px}.menu{display:grid;gap:8px;margin-top:25px}.menu button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;font-weight:850}.menu button.active{background:#eefbd5}.panel{padding:26px}.topline{display:flex;justify-content:space-between;gap:20px;align-items:start}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.mini{border:1px solid var(--line);border-radius:18px;padding:16px}.mini span{display:block;color:var(--muted);font-size:11px;font-weight:850;text-transform:uppercase}.mini b{font-size:26px}
