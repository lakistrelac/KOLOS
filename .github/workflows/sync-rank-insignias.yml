name: Sync rank insignias

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dashboard and landing insignias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          shared = r'''function rankSvg(type,high){
          const icons={
            initiate: high?
              '<path d="M60 12 88 28v30c0 16-12 25-28 32-16-7-28-16-28-32V28z" fill="currentColor" opacity=".10"/><path d="M60 12 88 28v30c0 16-12 25-28 32-16-7-28-16-28-32V28z"/><path d="M38 60h44"/><path d="m44 47 16 13 16-13"/><path d="M50 33h20"/>':
              '<path d="M60 17 84 31v27c0 14-10 22-24 28-14-6-24-14-24-28V31z" fill="currentColor" opacity=".08"/><path d="M60 17 84 31v27c0 14-10 22-24 28-14-6-24-14-24-28V31z"/><path d="M42 58h36"/><path d="m47 46 13 11 13-11"/>',
            vanguard: high?
              '<path d="M60 9 91 27v31c0 17-13 27-31 34-18-7-31-17-31-34V27z" fill="currentColor" opacity=".11"/><path d="M60 9 91 27v31c0 17-13 27-31 34-18-7-31-17-31-34V27z"/><path d="M60 72V26"/><path d="m42 47 18-18 18 18"/><path d="M39 61h42"/><path d="M47 76h26"/>':
              '<path d="M60 14 88 30v28c0 15-12 24-28 31-16-7-28-16-28-31V30z" fill="currentColor" opacity=".09"/><path d="M60 14 88 30v28c0 15-12 24-28 31-16-7-28-16-28-31V30z"/><path d="m44 52 16-18 16 18"/><path d="M45 64h30"/>',
            warrior: high?
              '<circle cx="60" cy="51" r="35" fill="currentColor" opacity=".08"/><path d="M31 20 89 78"/><path d="M89 20 31 78"/><path d="m27 16 14 4-10 10z" fill="currentColor"/><path d="m93 16-14 4 10 10z" fill="currentColor"/><path d="M37 79h46"/><path d="M45 66h30"/><path d="M60 38 67 50 60 62 53 50z" fill="currentColor" opacity=".2"/>':
              '<circle cx="60" cy="50" r="31" fill="currentColor" opacity=".06"/><path d="M34 22 86 74"/><path d="M86 22 34 74"/><path d="m30 18 12 4-8 8z" fill="currentColor"/><path d="m90 18-12 4 8 8z" fill="currentColor"/><path d="M42 77h36"/>',
            titan: high?
              '<path d="M60 8 98 29 91 67 60 92 29 67 22 29z" fill="currentColor" opacity=".12"/><path d="M60 8 98 29 91 67 60 92 29 67 22 29z"/><path d="M28 25h64l-8 20H69v39H51V45H36z" fill="currentColor" opacity=".18"/><path d="M28 25h64l-8 20H69v39H51V45H36z"/><path d="M39 85h42"/><path d="M60 16 67 27 60 38 53 27z" fill="currentColor"/>':
              '<path d="M60 13 92 31 86 64 60 86 34 64 28 31z" fill="currentColor" opacity=".09"/><path d="M60 13 92 31 86 64 60 86 34 64 28 31z"/><path d="M34 27h52l-7 17H68v37H52V44H41z"/><path d="M43 82h34"/>',
            kolos: high?
              '<path d="M60 7 96 29 90 72 60 94 30 72 24 29z" fill="currentColor" opacity=".13"/><path d="M60 7 96 29 90 72 60 94 30 72 24 29z"/><path d="M60 12 72 31 84 23 94 38 84 72 60 88 36 72 26 38 36 23 48 31z" fill="currentColor" opacity=".16"/><path d="M60 18v58"/><path d="M60 46 78 31"/><path d="M60 46 79 63"/><path d="M60 46 43 32"/><path d="M60 46 42 64"/><path d="M34 73h52"/><path d="M38 28v-9M48 25V13M72 25V13M82 28v-9"/>':
              '<path d="M60 11 92 31 87 69 60 89 33 69 28 31z" fill="currentColor" opacity=".10"/><path d="M60 11 92 31 87 69 60 89 33 69 28 31z"/><path d="M60 20v54"/><path d="M60 45 76 32"/><path d="M60 45 76 59"/><path d="M60 45 45 33"/><path d="M60 45 44 60"/><path d="M38 72h44"/>',
            dominus:
              '<circle cx="60" cy="50" r="40" fill="currentColor" opacity=".12"/><circle cx="60" cy="50" r="40"/><path d="m60 12 10 25 27 1-21 16 8 26-24-15-24 15 8-26-21-16 27-1z" fill="currentColor" opacity=".16"/><path d="m60 12 10 25 27 1-21 16 8 26-24-15-24 15 8-26-21-16 27-1z"/><circle cx="60" cy="50" r="9" fill="currentColor"/><path d="M42 92h36"/>'
          };
          return '<svg viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">'+icons[type]+'</svg>'
          }'''

          # Dashboard: replace local renderer only.
          p=Path('dashboard.html')
          s=p.read_text()
          dash_fn=shared.replace('function rankSvg','function svg')
          ns,n=re.subn(r"function svg\(type,high\)\{.*?\}function actual",dash_fn+'function actual',s,flags=re.S)
          if n!=1:
              raise SystemExit(f'dashboard svg replacement count={n}')
          p.write_text(ns)

          # Landing: same visual language everywhere.
          p=Path('index.html')
          s=p.read_text()
          landing_fn=shared.replace('function rankSvg','function svgInsignia')
          ns,n=re.subn(r"function svgInsignia\(type,high\)\{.*?\}\nfunction renderLandingRanks",landing_fn+'\nfunction renderLandingRanks',s,flags=re.S)
          if n!=1:
              raise SystemExit(f'index svg replacement count={n}')
          p.write_text(ns)
          PY
      - name: Commit upgraded insignias
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade KOLOS rank emblem hierarchy"
          git push
