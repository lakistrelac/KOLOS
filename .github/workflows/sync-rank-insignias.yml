name: KOLOS live upgrades

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate rank-aware training engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('dashboard.html')
          s=p.read_text()

          # All four training environments are now live and adaptive.
          s=s.replace('<span>INITIATE program aktivan</span>','<span>Adaptivni KOLOS engine</span>')
          s=s.replace('<span>U pripremi</span>','<span>Adaptivni KOLOS engine</span>')

          # DOMINUS is a real apex state, not a placeholder lock.
          s=s.replace("sub:'ZAKLJUČANO'","sub:'APEX'")
          s=s.replace("return v.r.single?'DOMINUS — ZAKLJUČANO':","return v.r.single?'DOMINUS — APEX':")

          intel_css=""".engineIntel{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.intelBox{padding:12px 13px;border-radius:15px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.06)}.intelBox span{display:block;font-size:9px;font-weight:1000;letter-spacing:.1em;color:#9fa79a;text-transform:uppercase}.intelBox b{display:block;margin-top:5px;font-size:13px}.coachNote{margin-top:10px;padding:13px 14px;border-radius:15px;background:rgba(200,255,77,.09);border:1px solid rgba(200,255,77,.18);color:#dce8c7;font-size:12px;line-height:1.55}@media(max-width:650px){.engineIntel{grid-template-columns:1fr}}"""
          if '.engineIntel{' not in s:
              s=s.replace('.mission{display:none',intel_css+'.mission{display:none',1)

          mission_anchor='<span id="missionTag" class="tag"></span></div><div class="timerBox">'
          mission_insert='<span id="missionTag" class="tag"></span></div><div id="engineIntel" class="engineIntel"><div class="intelBox"><span>ENGINE NIVO</span><b id="engineLevel">—</b></div><div class="intelBox"><span>PROGRESIJA</span><b id="progressionMode">—</b></div><div class="intelBox"><span>ODMOR</span><b id="restGuidance">—</b></div></div><div id="coachText" class="coachNote"></div><div class="timerBox">'
          if mission_anchor in s and 'id="engineIntel"' not in s:
              s=s.replace(mission_anchor,mission_insert,1)

          if "const envNames={gym:'Teretana'" not in s.split("const ranks=",1)[0]:
              s=s.replace("const q=id=>document.getElementById(id);const ranks=","const q=id=>document.getElementById(id);const envNames={gym:'Teretana',street:'Street Workout',conditioning:'Kondicija',home:'Kuća'};const ranks=",1)

          s=s.replace('todayCompleted=null,todayKey=null;','todayCompleted=null,todayKey=null,currentEnvironment=null,currentSessionId=null,currentRankPlan=null;',1)

          render_plan="""function renderPlan(p){currentPlan=p;currentRankPlan=p;currentEnvironment=p.environment||currentEnvironment;q('mission').className='mission open '+(p.type==='light'?'light':'');q('missionBody').classList.remove('hidden');q('doneScreen').classList.add('hidden');q('missionTitle').textContent=p.title;q('missionTag').textContent=p.engine_label||p.tag||'KOLOS';q('missionSub').textContent=p.coaching||'Fokus je kvalitetno, kontrolisano izvođenje i kontinuitet.';q('engineLevel').textContent=p.engine_label||p.tag||'KOLOS';q('progressionMode').textContent=p.progression||'Kontrolisana progresija';q('restGuidance').textContent=p.rest_seconds?String(p.rest_seconds)+' s između radnih serija':'Po osećaju';q('coachText').textContent=p.coaching||'Kvalitet izvođenja ima prednost nad brojkom.';q('phase').textContent=p.engine_label||'Disciplina';q('dayType').textContent=p.engine_label||'Adaptivni';q('reward').textContent='+'+Number(p.reward||0)+' XP';q('warmup').innerHTML='<div class="eyebrow" style="color:#b9c0b3">ZAGREVANJE</div><h3>Započni ovde</h3><div class="checkList">'+(p.warm||[]).map(item).join('')+'</div>';q('mainTitle').textContent=p.main||'Glavni deo';q('exerciseList').innerHTML=(p.a||[]).map(item).join('');q('secondTitle').textContent=p.second||'Dodatak';q('secondList').innerHTML=(p.b||[]).map(item).join('');const cardio=onboarding?.primary_goal==='weight'||onboarding?.primary_goal==='conditioning';q('conditioningBlock').innerHTML=currentEnvironment!=='conditioning'&&cardio?'<div class="conditioning"><b>KONDICIONI DODATAK</b><span>Opcioni lagani do umereni završetak. Kvalitet i oporavak imaju prednost.</span></div>':'';document.querySelectorAll('.tick').forEach(b=>b.onclick=()=>{b.parentElement.classList.toggle('done');updateChecks()});updateChecks()}function updateChecks"""
          s,n=re.subn(r"function renderPlan\(p\)\{.*?\}function updateChecks",render_plan,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('renderPlan replacement failed')

          start_handler="""q('startTimer').onclick=async()=>{if(startAt||todayCompleted||!currentPlan||!currentEnvironment)return;q('startTimer').disabled=true;const{data:sid,error}=await supabase.rpc('start_my_rank_session',{p_environment:currentEnvironment});if(error){alert('Ne mogu da pokrenem misiju: '+error.message);q('startTimer').disabled=false;return}currentSessionId=sid;startAt=Date.now();timerId=setInterval(timerTick,500);q('stopTimer').disabled=false};"""
          s,n=re.subn(r"q\('startTimer'\)\.onclick=\(\)=>\{.*?\};",start_handler,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('start timer replacement failed')

          show_completed="""function showCompleted(reward,env,mission){q('mission').className='mission open completed';q('missionBody').classList.add('hidden');q('doneScreen').classList.remove('hidden');q('earnedXp').textContent='+'+Number(reward||0)+' XP';q('dayType').textContent='Završeno';q('todayEnv').textContent=envNames[env]||'—';q('countdownLabel').textContent='Nova misija se otključava u ponoć';if(mission)q('missionTitle').textContent=mission}async function loadTodayState(){const{data,error}=await supabase.rpc('get_my_today_rank_state');if(error){todayKey=localKey();return}const row=Array.isArray(data)?data[0]:data;todayKey=row?.workout_date||localKey();todayCompleted=row?.completed?{reward_xp:row.reward_xp,mission_key:row.mission_key,environment:row.environment}:null;if(todayCompleted){currentEnvironment=todayCompleted.environment;showCompleted(todayCompleted.reward_xp,todayCompleted.environment,todayCompleted.mission_key)}}"""
          s,n=re.subn(r"function showCompleted\(reward\)\{.*?\}async function loadTodayState\(\)\{.*?\}",show_completed,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('today state replacement failed')

          finish_handler="""q('finishWorkout').onclick=async()=>{if(!currentPlan||todayCompleted||!currentEnvironment)return;if(startAt){elapsed+=Date.now()-startAt;startAt=null;clearInterval(timerId);timerTick()}q('finishWorkout').disabled=true;if(!currentSessionId){const{data:sid}=await supabase.rpc('start_my_rank_session',{p_environment:currentEnvironment});currentSessionId=sid||null}const{data,error}=await supabase.rpc('complete_rank_aware_workout',{p_environment:currentEnvironment,p_mission_key:currentPlan.title,p_elapsed_seconds:Math.floor(elapsed/1000)});if(error){alert(error.message);q('finishWorkout').disabled=false;return}const row=Array.isArray(data)?data[0]:data;if(row){progress.xp=row.new_xp;progress.current_rank=row.new_rank;progress.current_subrank=row.new_subrank;todayCompleted={reward_xp:row.reward_xp,mission_key:currentPlan.title,environment:currentEnvironment};renderHero();showCompleted(row.reward_xp,currentEnvironment,currentPlan.title);await renderCommandCenter()}};"""
          s,n=re.subn(r"q\('finishWorkout'\)\.onclick=async\(\)=>\{.*?\};function renderFuture",finish_handler+'function renderFuture',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('finish handler replacement failed')

          cc="""async function renderCommandCenter(){const v=actual(),xp=Number(progress?.xp||0),span=Math.max(1,v.range[1]-v.range[0]),pct=v.r.single?100:Math.max(0,Math.min(100,Math.round((xp-v.range[0])/span*100))),preferred=todayCompleted?.environment||onboarding?.preferred_environment||'gym';let plan=null;const{data:rankPlan,error:planError}=await supabase.rpc('get_my_rank_plan',{p_environment:preferred});if(!planError&&rankPlan)plan=rankPlan;else plan={...planForKey(todayKey||localKey()),environment:preferred,session_minutes:onboarding?.session_minutes||60,engine_label:'KOLOS',progression:'Kontrolisana progresija'};q('ccRankPercent').textContent=pct+'%';q('ccMissionTitle').textContent=todayCompleted?'Misija završena: '+(todayCompleted.mission_key||plan.title):plan.title;q('ccEnvironment').textContent=envNames[preferred]||'—';q('ccDuration').textContent=Number(plan.session_minutes||onboarding?.session_minutes||60)+' min';q('ccReward').textContent='+'+Number(todayCompleted?.reward_xp??plan.reward??0)+' XP';q('ccStart').textContent=todayCompleted?'DANAŠNJA MISIJA ZAVRŠENA':'ZAPOČNI MISIJU';q('ccStart').disabled=!!todayCompleted;q('ccHeadline').textContent=todayCompleted?'Današnji posao je završen.':'Danas gradiš sledeći nivo.';q('ccSub').textContent=todayCompleted?'Sačuvaj ritam. Sledeća misija se otključava sutra.':(plan.engine_label||'KOLOS')+' · '+(plan.progression||'adaptivna progresija');const since=new Date(Date.now()-7*86400000).toISOString();const{data:recent,error}=await supabase.from('workout_completions').select('workout_date,mission_key,reward_xp,completed_at,environment').eq('user_id',me.id).gte('completed_at',since).order('completed_at',{ascending:false});const week=error?[]:(recent||[]),goal=Math.max(2,Number(onboarding?.training_days||4));q('ccWeek').textContent=week.length;q('ccGoal').textContent=' / '+goal+' treninga';q('ccWeekBar').style.width=Math.min(100,week.length/goal*100)+'%';q('ccWeekText').textContent=week.length>=goal?'Nedeljni cilj je ispunjen. Održavaj ritam.':Math.max(0,goal-week.length)+' treninga do nedeljnog cilja.';q('ccRecent').innerHTML=week.length?week.slice(0,3).map(x=>'<div><strong>'+x.mission_key+'</strong><span>+'+x.reward_xp+' XP</span></div>').join(''):'<div class="ccEmpty">Prva završena misija će se pojaviti ovde.</div>';q('ccStart').onclick=()=>{const btn=document.querySelector('.env[data-env="'+preferred+'"]')||document.querySelector('.env[data-env="gym"]');if(btn){btn.click();setTimeout(()=>q('mission').scrollIntoView({behavior:'smooth',block:'start'}),120)}}}"""
          s,n=re.subn(r"async function renderCommandCenter\(\)\{.*?\}async function boot\(\)",cc+'async function boot()',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('command center replacement failed')

          env_handler="""document.querySelectorAll('.env').forEach(b=>b.onclick=async()=>{const env=b.dataset.env;currentEnvironment=env;currentSessionId=null;document.querySelectorAll('.env').forEach(x=>x.classList.toggle('active',x===b));q('todayEnv').textContent=envNames[env]||'—';await supabase.from('daily_training_choices').upsert({user_id:me.id,training_date:todayKey||localKey(),environment:env},{onConflict:'user_id,training_date'});if(todayCompleted){showCompleted(todayCompleted.reward_xp,todayCompleted.environment,todayCompleted.mission_key);return}q('mission').className='mission open';q('missionBody').classList.remove('hidden');q('missionTitle').textContent='KOLOS sastavlja misiju…';q('missionSub').textContent='Rang, iskustvo, vreme i okruženje ulaze u plan.';const{data:plan,error}=await supabase.rpc('get_my_rank_plan',{p_environment:env});if(error||!plan){q('mission').className='mission open light';q('missionTitle').textContent='PLAN TRENUTNO NIJE DOSTUPAN';q('missionTag').textContent='PONOVI';q('missionSub').textContent=error?.message||'Pokušaj ponovo.';q('warmup').innerHTML='';q('exerciseList').innerHTML='';q('secondList').innerHTML='';q('engineIntel').classList.add('hidden');q('coachText').classList.add('hidden');q('finishWorkout').disabled=true;return}q('engineIntel').classList.remove('hidden');q('coachText').classList.remove('hidden');renderPlan(plan)});q('adminToggle')"""
          s,n=re.subn(r"document\.querySelectorAll\('\.env'\)\.forEach\(b=>b\.onclick=async\(\)=>\{.*?\}\);q\('adminToggle'\)",env_handler,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('environment handler replacement failed')

          p.write_text(s)
          PY
      - name: Commit rank-aware engine UI
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate KOLOS rank-aware training engine"
          git push
