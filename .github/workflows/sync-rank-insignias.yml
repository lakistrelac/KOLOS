name: KOLOS live upgrades

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild KOLOS landing experience
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          css=r'''
/* KOLOS LANDING V4 — conversion + responsive product story */
.lpHero{padding:72px 0 52px;position:relative;overflow:hidden}.lpHero:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(200,255,77,.24),rgba(200,255,77,0) 68%);left:-260px;top:-230px;pointer-events:none}.lpHeroGrid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(440px,.98fr);gap:58px;align-items:center}.lpEyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:#151814;color:#f7f5ee;font-size:10px;font-weight:1000;letter-spacing:.12em}.lpEyebrow i{width:8px;height:8px;border-radius:50%;background:#c8ff4d;box-shadow:0 0 0 5px rgba(200,255,77,.14)}.lpHero h1{font-size:clamp(54px,6.6vw,88px);line-height:.94;letter-spacing:-.065em;margin:21px 0 20px;max-width:760px}.lpHero h1 em{font-style:normal;position:relative;z-index:0}.lpHero h1 em:after{content:"";position:absolute;left:-3px;right:-5px;bottom:.07em;height:.2em;border-radius:4px;background:#c8ff4d;z-index:-1;transform:rotate(-1deg)}.lpLead{max-width:660px;font-size:18px;line-height:1.67;color:var(--muted);margin:0}.lpActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}.lpActions .btn{padding:14px 20px}.lpPrimaryCta{background:#c8ff4d;color:#121411;box-shadow:0 12px 28px rgba(151,194,49,.22)}.lpSecondaryCta{background:#fff;color:#121411;border:1px solid var(--line)}.lpPromise{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.lpPromise span{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.72);font-size:11px;font-weight:900;color:#596057}.lpPreviewWrap{position:relative;min-height:575px;display:grid;place-items:center}.lpPreviewGlow{position:absolute;width:390px;height:390px;border-radius:50%;background:linear-gradient(135deg,rgba(200,255,77,.3),rgba(92,82,255,.11));filter:blur(2px)}.lpPhone{position:relative;width:min(430px,100%);background:#151814;border:1px solid #30362d;color:#f7f8f3;border-radius:34px;padding:18px;box-shadow:0 34px 75px rgba(18,20,17,.23);transform:rotate(1.3deg)}.lpPhone:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.05);border-radius:28px;pointer-events:none}.lpPhoneTop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 4px 16px}.lpPhoneTop img{width:118px;filter:brightness(0) invert(1)}.lpLive{font-size:9px;font-weight:1000;letter-spacing:.1em;color:#c8ff4d}.lpMission{background:#f8f7f2;color:#121411;border-radius:24px;padding:19px;position:relative;overflow:hidden}.lpMission:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-80px;top:-75px;background:#eaffb8}.lpMiniLabel{font-size:9px;letter-spacing:.12em;font-weight:1000;color:#687063;text-transform:uppercase}.lpMission h3{font-size:26px;line-height:1.02;letter-spacing:-.035em;margin:8px 0 9px;max-width:270px}.lpMissionMeta{display:flex;gap:6px;flex-wrap:wrap}.lpMissionMeta span{padding:6px 8px;border-radius:999px;background:#eceee8;font-size:9px;font-weight:950}.lpExerciseMini{display:grid;gap:7px;margin-top:16px}.lpExerciseMini div{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;padding:10px 11px;border-radius:13px;background:#fff;border:1px solid #e3e5dd;font-size:11px;font-weight:850}.lpExerciseMini i{width:22px;height:22px;border:1px solid #cbd0c5;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:9px}.lpExerciseMini small{font-size:9px;color:#727970;font-weight:900}.lpRankMini{display:flex;align-items:center;gap:11px;margin-top:12px;border-radius:18px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.09);padding:12px}.lpRankMini .demoShield{width:56px;height:56px;border:0;background:transparent;border-radius:0}.lpRankMini .demoShield svg{width:54px;height:54px}.lpRankMini b{display:block;font-size:13px}.lpRankMini span{display:block;color:#aeb5a8;font-size:10px;margin-top:3px}.lpFloatNote{position:absolute;right:-18px;bottom:38px;width:190px;padding:12px 14px;border-radius:16px;background:#fff;color:#121411;border:1px solid var(--line);box-shadow:var(--shadow);transform:rotate(-3deg)}.lpFloatNote b{font-size:22px}.lpFloatNote span{display:block;font-size:10px;color:var(--muted);font-weight:850;margin-top:2px}.lpSignal{border-top:1px solid rgba(222,223,215,.75);border-bottom:1px solid rgba(222,223,215,.75);background:rgba(255,255,255,.42)}.lpSignalGrid{min-height:88px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.lpSignalItem{padding:13px 18px;border-right:1px solid var(--line)}.lpSignalItem:first-child{padding-left:0}.lpSignalItem:last-child{border-right:0}.lpSignalItem b{display:block;font-size:13px}.lpSignalItem span{display:block;font-size:10px;color:var(--muted);font-weight:800;margin-top:3px}.lpSection{padding:88px 0}.lpSectionHead{max-width:820px}.lpSectionHead .label{margin-bottom:10px}.lpSectionHead h2{font-size:clamp(40px,5.4vw,66px);line-height:.98;letter-spacing:-.055em;margin:0}.lpSectionHead p{font-size:16px;color:var(--muted);line-height:1.65;max-width:680px;margin:18px 0 0}.lpSteps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}.lpStep{min-height:230px;padding:22px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.84);position:relative;overflow:hidden}.lpStepNum{font-size:11px;font-weight:1000;letter-spacing:.12em;color:#8b9188}.lpStepIcon{width:48px;height:48px;border-radius:15px;background:#c8ff4d;display:grid;place-items:center;font-size:22px;margin:22px 0 16px}.lpStep h3{font-size:21px;margin:0 0 7px}.lpStep p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}.lpStep:after{content:"";position:absolute;width:95px;height:95px;border-radius:50%;right:-55px;bottom:-55px;background:#f0f2eb}.lpEnvs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}.lpEnv{min-height:245px;padding:22px;border-radius:24px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}.lpEnvIcon{font-size:34px}.lpEnv h3{font-size:22px;margin:24px 0 7px}.lpEnv p{font-size:12px;line-height:1.55;color:var(--muted);margin:0;max-width:220px}.lpEnvTag{position:absolute;left:22px;bottom:20px;font-size:9px;font-weight:1000;letter-spacing:.1em;color:#5e655b}.lpEnv:nth-child(2){background:#f3f1ff}.lpEnv:nth-child(3){background:#eef8df}.lpEnv:nth-child(4){background:#fff0e9}.lpPsych{padding:0 0 88px}.lpPsychBox{background:linear-gradient(135deg,#121510,#222a1a);color:#f5f7f0;border-radius:34px;padding:38px;position:relative;overflow:hidden}.lpPsychBox:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-230px;top:-250px;background:rgba(200,255,77,.12)}.lpPsychTop{position:relative;z-index:1;max-width:730px}.lpPsychTop h2{font-size:clamp(38px,5vw,62px);line-height:.98;letter-spacing:-.05em;margin:8px 0 14px}.lpPsychTop p{color:#bbc2b6;line-height:1.65}.lpPsychGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px;position:relative;z-index:1}.lpPsychCard{padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055)}.lpPsychCard b{font-size:15px}.lpPsychCard span{display:block;color:#aeb6aa;font-size:11px;line-height:1.5;margin-top:6px}.lpRanksIntro{display:flex;align-items:end;justify-content:space-between;gap:22px}.lpRanksIntro p{max-width:440px;color:var(--muted);font-size:13px;line-height:1.55}.lpJoin{padding:42px 0 92px}.lpJoinBox{padding:48px;border-radius:34px;background:linear-gradient(135deg,#eeffba,#c8ff4d);display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;box-shadow:0 20px 60px rgba(132,176,32,.16)}.lpJoinBox h2{font-size:clamp(38px,5vw,62px);line-height:.96;letter-spacing:-.055em;margin:0}.lpJoinBox p{max-width:630px;line-height:1.55;color:#48513b;margin:13px 0 0}.lpJoinBox .btn{background:#121411;color:#fff;padding:15px 21px;white-space:nowrap}.lpMobileCta{display:none}.lpFooter{padding:30px 0 46px;border-top:1px solid var(--line)}.lpFooterIn{display:flex;justify-content:space-between;gap:18px;align-items:center;color:var(--muted);font-size:11px}.lpFooterIn img{width:128px;opacity:.72}
@media(max-width:980px){.lpHeroGrid{grid-template-columns:1fr;gap:28px}.lpHero{padding-top:54px}.lpPreviewWrap{min-height:auto;padding:4px 0 20px}.lpPhone{transform:none}.lpFloatNote{right:4px;bottom:2px}.lpSteps,.lpEnvs{grid-template-columns:1fr 1fr}.lpSignalGrid{grid-template-columns:1fr 1fr}.lpSignalItem:nth-child(2){border-right:0}.lpSignalItem:nth-child(-n+2){border-bottom:1px solid var(--line)}.lpPsychGrid{grid-template-columns:1fr}.lpJoinBox{grid-template-columns:1fr}.lpJoinBox .btn{justify-self:start}.lpRanksIntro{align-items:flex-start;flex-direction:column}}
@media(max-width:620px){body{padding-bottom:74px}.landing{overflow:hidden}.navin{min-height:68px}.brandLogo{width:134px}.navActions .primary{background:#121411}.lpHero{padding:38px 0 28px}.lpHeroGrid{gap:22px}.lpEyebrow{font-size:9px}.lpHero h1{font-size:46px;line-height:.95;margin:17px 0}.lpLead{font-size:15px;line-height:1.6}.lpActions{display:grid;grid-template-columns:1fr;margin-top:22px}.lpActions .btn{width:100%;padding:14px 16px}.lpPromise{gap:6px}.lpPromise span{font-size:10px;padding:6px 8px}.lpPreviewWrap{display:block}.lpPhone{width:100%;border-radius:27px;padding:14px}.lpPhoneTop img{width:102px}.lpMission{border-radius:19px;padding:16px}.lpMission h3{font-size:23px}.lpExerciseMini div{grid-template-columns:24px 1fr auto;padding:9px;font-size:10px}.lpFloatNote{position:relative;right:auto;bottom:auto;width:auto;margin:-4px 12px 0;transform:none}.lpSignalGrid{grid-template-columns:1fr 1fr}.lpSignalItem{padding:12px}.lpSignalItem:first-child{padding-left:12px}.lpSignalItem b{font-size:11px}.lpSignalItem span{font-size:9px}.lpSection{padding:66px 0}.lpSectionHead h2{font-size:40px}.lpSectionHead p{font-size:14px}.lpSteps,.lpEnvs{grid-template-columns:1fr;gap:9px}.lpStep{min-height:0;padding:18px}.lpStepIcon{margin:16px 0 13px}.lpEnv{min-height:190px}.lpPsych{padding-bottom:66px}.lpPsychBox{padding:25px 20px;border-radius:25px}.lpPsychTop h2{font-size:38px}.lpPsychGrid{gap:8px}.lpJoin{padding:20px 0 55px}.lpJoinBox{padding:28px 22px;border-radius:25px}.lpJoinBox h2{font-size:39px}.lpJoinBox .btn{width:100%}.lpMobileCta{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:40;background:#121411;color:#fff;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:9px 9px 9px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,.28)}.lpMobileCta span{font-size:10px;font-weight:900;line-height:1.25}.lpMobileCta .btn{padding:10px 13px;background:#c8ff4d;color:#121411;border-radius:12px;font-size:11px}.lpFooterIn{align-items:flex-start;flex-direction:column}.section#ranks{padding-top:66px}.rankShowcase{gap:10px}.rankPair2{gap:7px}.tier2{min-height:145px;padding:9px}}
'''
          if 'KOLOS LANDING V4' not in s:
              s=s.replace('</style>',css+'</style>',1)

          nav='''<nav class="nav"><div class="wrap navin"><img class="brandLogo" src="assets/kolos-logo-final.svg?v=2" alt="KOLOS"><div class="navlinks"><a href="#system">Kako radi</a><a href="#training">Treninzi</a><a href="#ranks">Rangovi</a></div><div class="navActions"><button class="btn soft" onclick="location.href='login.html'">Prijava</button><button class="btn primary" onclick="location.href='login.html'">Počni</button></div></div></nav>'''
          s,n=re.subn(r'<nav class="nav">.*?</nav>',nav,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('landing nav replacement failed')

          hero='''<section class="lpHero"><div class="wrap lpHeroGrid"><div><div class="lpEyebrow"><i></i> KOLOS TRAINING SYSTEM</div><h1>Jedna misija danas.<br><em>Jasan napredak sutra.</em></h1><p class="lpLead">Ne moraš da biraš između stotinu programa i nagađaš šta je sledeće. KOLOS koristi tvoj rang, iskustvo, vreme i način treninga da ti pokaže sledeću misiju — a zatim pamti rezultat i gradi nastavak.</p><div class="lpActions"><button class="btn lpPrimaryCta" onclick="location.href='login.html'">Započni svoj KOLOS →</button><button class="btn lpSecondaryCta" onclick="document.getElementById('system').scrollIntoView()">Pogledaj kako radi</button></div><div class="lpPromise"><span>Teretana</span><span>Street Workout</span><span>Kuća</span><span>Kondicija</span><span>Rangovi + XP</span></div></div><div class="lpPreviewWrap"><div class="lpPreviewGlow"></div><div class="lpPhone"><div class="lpPhoneTop"><img src="assets/kolos-logo-final.svg?v=2" alt="KOLOS"><span class="lpLive">● LIVE ENGINE</span></div><div class="lpMission"><div class="lpMiniLabel">DEMO · DANAŠNJA MISIJA</div><h3>TERETANA · FULL BODY A</h3><div class="lpMissionMeta"><span>FOUNDATION I</span><span>45 MIN</span><span>+45 XP</span></div><div class="lpExerciseMini"><div><i>✓</i><span>Chest press sprava</span><small>2 × 8–12</small></div><div><i>✓</i><span>Seated row</span><small>2 × 8–12</small></div><div><i>✓</i><span>Leg press</span><small>2 × 8–12</small></div></div></div><div class="lpRankMini"><div class="demoShield" id="demoShield"></div><div><b>Rang koji prati kontinuitet</b><span>Plan postaje precizniji kako napreduješ.</span></div></div></div><div class="lpFloatNote"><div class="lpMiniLabel">SLEDEĆI KORAK</div><b>Bez lutanja.</b><span>Otvori KOLOS. Vidi misiju. Treniraj.</span></div></div></div></section>'''
          s,n=re.subn(r'<section class="hero">.*?</section>',hero,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('hero replacement failed')

          system='''<div class="lpSignal"><div class="wrap lpSignalGrid"><div class="lpSignalItem"><b>Adaptivni plan</b><span>rang + iskustvo + vreme</span></div><div class="lpSignalItem"><b>A/B/C rotacije</b><span>trening ne ostaje isti</span></div><div class="lpSignalItem"><b>Pamti rezultate</b><span>prethodni rad postaje kontekst</span></div><div class="lpSignalItem"><b>11 nivoa sistema</b><span>od INITIATE do DOMINUS</span></div></div></div><section class="lpSection" id="system"><div class="wrap"><div class="lpSectionHead"><div class="label">KAKO KOLOS RADI</div><h2>Manje odluka.<br>Više jasnog rada.</h2><p>Dobar trening sistem ne treba da te zatrpa opcijama. Treba da ti u pravom trenutku pokaže ono što je važno — i da postaje korisniji što ga duže koristiš.</p></div><div class="lpSteps"><article class="lpStep"><span class="lpStepNum">01 · PROFIL</span><div class="lpStepIcon">◎</div><h3>Kažeš gde si sada.</h3><p>Cilj, iskustvo, broj dana, vreme i okruženje daju KOLOS-u početni kontekst.</p></article><article class="lpStep"><span class="lpStepNum">02 · MISIJA</span><div class="lpStepIcon">→</div><h3>Dobijaš sledeći korak.</h3><p>Jedan jasan trening, ciljane serije i nivo vođenja koji odgovara tvom rangu.</p></article><article class="lpStep"><span class="lpStepNum">03 · REZULTAT</span><div class="lpStepIcon">↗</div><h3>KOLOS pamti šta si uradio.</h3><p>Na naprednijim nivoima beležiš rezultat i sledeći trening dobija stvarni kontekst.</p></article><article class="lpStep"><span class="lpStepNum">04 · NAPREDAK</span><div class="lpStepIcon">◆</div><h3>Rasteš kroz sistem.</h3><p>XP, podrang i rang daju jasan osećaj puta bez potrebe da svaki dan izmišljaš novi plan.</p></article></div></div></section><section class="lpSection" id="training" style="padding-top:16px"><div class="wrap"><div class="lpSectionHead"><div class="label">TVOJ NAČIN TRENINGA</div><h2>Promeni mesto.<br>Ne gubi pravac.</h2><p>KOLOS nije vezan za jednu vrstu treninga. Sistem zadržava isti osećaj napretka dok se sama misija prilagođava okruženju.</p></div><div class="lpEnvs"><article class="lpEnv"><div class="lpEnvIcon">🏋️</div><h3>Teretana</h3><p>Strukturisane radne serije, progresija i rezultat prethodnog treninga.</p><span class="lpEnvTag">GYM ENGINE</span></article><article class="lpEnv"><div class="lpEnvIcon">⚡</div><h3>Street Workout</h3><p>Kontrola tela, progresije pokreta i plan koji raste zajedno sa sposobnošću.</p><span class="lpEnvTag">STREET ENGINE</span></article><article class="lpEnv"><div class="lpEnvIcon">⌂</div><h3>Kuća</h3><p>Smislen trening sa onim što imaš, bez osećaja da radiš “rezervnu” verziju.</p><span class="lpEnvTag">HOME ENGINE</span></article><article class="lpEnv"><div class="lpEnvIcon">◒</div><h3>Kondicija</h3><p>Tempo, trajanje i kontrolisani rad prilagođen iskustvu i raspoloživom vremenu.</p><span class="lpEnvTag">CONDITIONING</span></article></div></div></section><section class="lpPsych"><div class="wrap"><div class="lpPsychBox"><div class="lpPsychTop"><div class="label" style="color:#c8ff4d">ZAŠTO ŽELIŠ DA SE VRATIŠ</div><h2>Napredak koji vidiš menja način na koji doživljavaš trening.</h2><p>KOLOS ne pokušava da te motiviše pritiskom. Sistem smanjuje neizvesnost, daje povratnu informaciju i čuva kontinuitet tako da sledeći dolazak ima smisla.</p></div><div class="lpPsychGrid"><div class="lpPsychCard"><b>Jasan sledeći korak</b><span>Manje vremena trošiš na pitanje “šta danas?”, više na sam trening.</span></div><div class="lpPsychCard"><b>Vidljiv osećaj kompetencije</b><span>Rezultat, XP i rang pokazuju da ono što radiš ima nastavak i smer.</span></div><div class="lpPsychCard"><b>Kontinuitet bez perfekcionizma</b><span>Jedan slabiji dan nije ceo put. Bitno je da se sistemu vratiš i nastaviš.</span></div></div></div></div></section>'''
          s,n=re.subn(r'<section class="section" id="system">.*?</section>',system,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('system replacement failed')

          ranks='''<section class="section" id="ranks"><div class="wrap"><div class="lpRanksIntro"><div><div class="label">RANGOVI</div><h2>Rang menja iskustvo.<br>Ne samo boju.</h2></div><p>Niži nivoi dobijaju više jasnoće i manje odluka. Viši nivoi otključavaju više kontrole, istorije rezultata i preciznije progresije.</p></div><div class="rankShowcase" id="landingRanks"></div></div></section>'''
          s,n=re.subn(r'<section class="section" id="ranks">.*?</section>',ranks,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ranks replacement failed')

          join='''<section class="lpJoin" id="join"><div class="wrap"><div class="lpJoinBox"><div><div class="label">TVOJ PRVI KORAK</div><h2>Ne traži savršen plan.<br>Počni da gradiš sistem.</h2><p>Napravi nalog, završi početni upitnik i otvori svoju prvu KOLOS misiju. Sistem će imati sve više smisla kako bude učio iz tvog napretka.</p></div><button class="btn" onclick="location.href='login.html'">Započni svoj KOLOS →</button></div></div></section>'''
          s,n=re.subn(r'<section class="section" id="pricing">.*?</section>',join,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('pricing/join replacement failed')

          footer='''<footer class="lpFooter"><div class="wrap lpFooterIn"><img src="assets/kolos-logo-final.svg?v=2" alt="KOLOS"><span>FOCUS · CONSISTENCY · POWER</span><span>Treniraj. Napreduj. Zadrži rang.</span></div></footer><div class="lpMobileCta"><span>Spreman za prvu misiju?</span><button class="btn" onclick="location.href='login.html'">Započni →</button></div>'''
          s,n=re.subn(r'<footer class="footer">.*?</footer>',footer,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('footer replacement failed')

          required=['KOLOS LANDING V4','Jedna misija danas.','lpPhone','Manje odluka.','Promeni mesto.','Kontinuitet bez perfekcionizma','Rang menja iskustvo.','Započni svoj KOLOS','lpMobileCta','id="landingRanks"','id="demoShield"']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing landing markers: '+', '.join(missing))

          if 'id="pricing"' in s: raise SystemExit('old pricing section still present')
          p.write_text(s)
          PY

      - name: Validate landing JavaScript and structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?: type="module")?>(.*?)</script>',html,re.S)
          if not scripts: raise SystemExit('landing script not found')
          Path('/tmp/kolos-index.js').write_text('\n'.join(scripts))
          for token in ['id="system"','id="training"','id="ranks"','id="join"','id="landingRanks"','id="demoShield"']:
              if token not in html: raise SystemExit('missing '+token)
          PY
          node --check /tmp/kolos-index.js

      - name: Commit landing redesign
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Redesign KOLOS landing for mobile and desktop"
          git push
