name: KOLOS live upgrades

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy gym state tail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('dashboard.html')
          s = p.read_text()

          # A legacy gym-only tail remained after get_my_today_rank_state()
          # and produced `Unexpected token =` in the browser.
          pattern = r"\}=await supabase\.rpc\('get_my_today_workout_state'\);if\(error\)\{todayKey=localKey\(\);return\}const row=Array\.isArray\(data\)\?data\[0\]:data;todayKey=row\?\.workout_date\|\|localKey\(\);todayCompleted=row\?\.completed\?\{reward_xp:row\.reward_xp,mission_key:row\.mission_key\}:null;if\(todayCompleted\)showCompleted\(todayCompleted\.reward_xp\)\}"
          ns, n = re.subn(pattern, '}', s, count=1)
          if n != 1:
              raise SystemExit(f'legacy tail removal count={n}')

          required = [
              "get_my_rank_plan",
              "start_my_rank_session",
              "complete_rank_aware_workout",
              "get_my_today_rank_state",
              "Adaptivni KOLOS engine",
              "DOMINUS — APEX",
          ]
          missing = [x for x in required if x not in ns]
          if missing:
              raise SystemExit('missing V2 markers: ' + ', '.join(missing))

          p.write_text(ns)
          PY

      - name: Validate dashboard JavaScript before commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dashboard.html').read_text()
          m = re.search(r'<script type="module">(.*)</script>', html, re.S)
          if not m:
              raise SystemExit('dashboard module script not found')
          Path('/tmp/kolos-dashboard.mjs').write_text(m.group(1))
          PY
          node --check /tmp/kolos-dashboard.mjs

      - name: Commit repaired dashboard
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair KOLOS rank engine dashboard syntax"
          git push
