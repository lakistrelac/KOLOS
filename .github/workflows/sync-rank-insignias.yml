name: KOLOS live upgrades

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose adaptive rotation and next-focus coaching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('dashboard.html')
          s=p.read_text()

          s=s.replace('.engineIntel{display:grid;grid-template-columns:repeat(3,1fr);', '.engineIntel{display:grid;grid-template-columns:repeat(4,1fr);', 1)
          if '.nextCue{' not in s:
              s=s.replace('.exerciseCopy{min-width:0}', '.exerciseCopy{min-width:0}.nextCue{display:block!important;margin-top:4px!important;color:#d9e7bd!important;font-size:10px!important;line-height:1.45}.prevResult{display:block!important}', 1)

          old='<div class="intelBox"><span>ENGINE NIVO</span><b id="engineLevel">—</b></div><div class="intelBox"><span>PROGRESIJA</span><b id="progressionMode">—</b></div>'
          new='<div class="intelBox"><span>ENGINE NIVO</span><b id="engineLevel">—</b></div><div class="intelBox"><span>ROTACIJA</span><b id="rotationMode">—</b></div><div class="intelBox"><span>PROGRESIJA</span><b id="progressionMode">—</b></div>'
          if old in s and 'id="rotationMode"' not in s:
              s=s.replace(old,new,1)

          item_fn="""function item(e){const slug=e[2]||'',previous=e[3]||'Kontrolisano izvođenje',cue=e[4]||'',blocked=['plank','dead-bug','mobility-flow','brisk-walk','easy-jog','easy-cycle'],canLog=Number(currentPlan?.complexity||0)>=3&&slug&&currentEnvironment!=='conditioning'&&!blocked.includes(slug);return '<div class="checkItem" data-slug="'+slug+'"><button class="tick" type="button">✓</button><div class="exerciseCopy"><b>'+e[0]+'</b><span class="prevResult">'+previous+'</span>'+(cue?'<span class="nextCue">'+cue+'</span>':'')+(canLog?'<button class="logResult" type="button">＋ Zabeleži seriju</button><div class="resultPanel"><div class="resultFields"><input class="repsInput" type="number" min="1" max="100" inputmode="numeric" placeholder="pon."><input class="loadInput" type="number" min="0" max="500" step="0.5" inputmode="decimal" placeholder="kg (opciono)"><button class="saveResult" type="button">Sačuvaj</button></div><div class="resultStatus"></div></div>':'')+'</div><div class="target">'+e[1]+'</div></div>'}async function ensureActiveSession"""
          s,n=re.subn(r"function item\(e\)\{.*?\}async function ensureActiveSession",item_fn,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'item replacement count={n}')

          marker="q('engineLevel').textContent=p.engine_label||p.tag||'KOLOS';q('progressionMode').textContent=p.progression||'Kontrolisana progresija';"
          replacement="q('engineLevel').textContent=p.engine_label||p.tag||'KOLOS';q('rotationMode').textContent=(p.variant_key||'—')+' · '+Number(p.rotation_index||1)+'/'+Number(p.rotation_total||1);q('progressionMode').textContent=p.progression||'Kontrolisana progresija';"
          if marker not in s:
              raise SystemExit('renderPlan rotation marker missing')
          s=s.replace(marker,replacement,1)

          cc_old="(plan.engine_label||'KOLOS')+' · '+(plan.progression||'adaptivna progresija')"
          cc_new="(plan.engine_label||'KOLOS')+' · rotacija '+(plan.variant_key||'—')+' · '+(plan.progression||'adaptivna progresija')"
          if cc_old in s:
              s=s.replace(cc_old,cc_new,1)

          required=['rotationMode','variant_key','rotation_index','nextCue','cue=e[4]','save_my_work_set']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('missing adaptive UI markers: '+', '.join(missing))

          p.write_text(s)
          PY

      - name: Validate dashboard JavaScript before commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('dashboard.html').read_text()
          m=re.search(r'<script type="module">(.*)</script>',html,re.S)
          if not m: raise SystemExit('dashboard module script not found')
          Path('/tmp/kolos-dashboard.mjs').write_text(m.group(1))
          PY
          node --check /tmp/kolos-dashboard.mjs

      - name: Commit adaptive coaching UI
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Expose KOLOS adaptive rotation and next-focus coaching"
          git push
