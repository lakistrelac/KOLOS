name: KOLOS live upgrades

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible Engine V2 launch strip
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('dashboard.html')
          s=p.read_text()

          css=""".engineLaunchStrip{margin-top:12px;padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,#121510,#202817);color:#f7f8f3;border:1px solid rgba(200,255,77,.26);display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 14px 34px rgba(20,22,18,.11)}.engineLaunchCopy{min-width:0}.engineLaunchKicker{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:#c8ff4d;color:#121411;font-size:9px;font-weight:1000;letter-spacing:.11em}.engineLaunchStrip strong{display:block;font-size:22px;margin-top:9px;letter-spacing:-.03em}.engineLaunchStrip p{margin:5px 0 0;color:#b8c0b2;font-size:12px;line-height:1.5}.engineLaunchPills{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.engineLaunchPills span{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);font-size:10px;font-weight:950;white-space:nowrap}@media(max-width:760px){.engineLaunchStrip{align-items:flex-start;flex-direction:column}.engineLaunchPills{justify-content:flex-start}}"""
          if '.engineLaunchStrip{' not in s:
              s=s.replace('.stats{display:grid;',css+'.stats{display:grid;',1)

          block='''<section id="engineLaunchStrip" class="engineLaunchStrip"><div class="engineLaunchCopy"><span class="engineLaunchKicker">● KOLOS ENGINE V2 · LIVE</span><strong>Adaptivni trening je aktivan.</strong><p>KOLOS sada koristi tvoj rang, iskustvo, raspoloživo vreme, prethodne treninge i A/B/C rotaciju pri izboru misije.</p></div><div class="engineLaunchPills"><span>11 nivoa</span><span>4 okruženja</span><span>A/B/C rotacije</span><span>memorija rezultata</span></div></section>'''

          anchor='</div></div><div class="stats">'
          if 'id="engineLaunchStrip"' not in s:
              if anchor not in s:
                  raise SystemExit('hero/stats anchor not found')
              s=s.replace(anchor,'</div></div>'+block+'<div class="stats">',1)

          required=['KOLOS ENGINE V2 · LIVE','Adaptivni trening je aktivan.','11 nivoa','A/B/C rotacije','memorija rezultata','get_my_rank_plan','save_my_work_set']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('missing visible V2 markers: '+', '.join(missing))

          p.write_text(s)
          PY

      - name: Validate dashboard JavaScript before commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('dashboard.html').read_text()
          m=re.search(r'<script type="module">(.*)</script>',html,re.S)
          if not m: raise SystemExit('dashboard module script not found')
          Path('/tmp/kolos-dashboard.mjs').write_text(m.group(1))
          PY
          node --check /tmp/kolos-dashboard.mjs

      - name: Commit visible Engine V2 strip
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Make KOLOS Engine V2 visible on dashboard"
          git push
