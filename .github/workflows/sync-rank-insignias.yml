name: Sync rank insignias

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix questionnaire completion flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('questionnaire.html')
          s=p.read_text()

          s=s.replace('<h2>Oprema i ograničenja</h2>','<h2>Oprema</h2>')
          s=s.replace('<div class="field full"><label>Pokreti ili vežbe koje želiš da izbegavaš (opciono)</label><textarea id="limitations"></textarea></div>','')

          old="q('finish').onclick=async()=>{if(!valid())return;q('finish').disabled=true;q('finish').textContent='Čuvam...';const payload={user_id:user.id,preferred_environment:state.environment,primary_goal:state.goal,age:Number(q('age').value),body_weight:Number(q('weight').value),experience_level:q('level').value,training_days:Number(q('days').value),session_minutes:Number(q('minutes').value),pushups_band:q('pushups').value,pullups_band:q('pullups').value,plank_band:q('plank').value,cardio_level:q('cardio').value,equipment:[q('equipment').value],limitations:q('limitations').value.trim(),updated_at:new Date().toISOString()};const{error:e1}=await supabase.from('onboarding_profiles').upsert(payload);if(e1){q('error').textContent='Čuvanje nije uspelo. Pokušaj ponovo.';q('error').classList.remove('hidden');q('finish').disabled=false;q('finish').textContent='Formiraj profil';return}await supabase.from('profiles').update({onboarding_complete:true,updated_at:new Date().toISOString()}).eq('id',user.id);"
          new="q('finish').onclick=async()=>{if(!valid())return;q('finish').disabled=true;q('finish').textContent='Čuvam...';const{error:e1}=await supabase.rpc('save_my_onboarding',{p_preferred_environment:state.environment,p_primary_goal:state.goal,p_age:Number(q('age').value),p_body_weight:Number(q('weight').value),p_experience_level:q('level').value,p_training_days:Number(q('days').value),p_session_minutes:Number(q('minutes').value),p_pushups_band:q('pushups').value,p_pullups_band:q('pullups').value,p_plank_band:q('plank').value,p_cardio_level:q('cardio').value,p_equipment:[q('equipment').value]});if(e1){q('error').textContent='Čuvanje nije uspelo: '+e1.message;q('error').classList.remove('hidden');q('finish').disabled=false;q('finish').textContent='Formiraj profil';return}"
          if old not in s:
              raise SystemExit('finish handler not found')
          s=s.replace(old,new,1)

          # Restore blocked-user guard if it was not yet deployed.
          marker="async function boot(){const{data:{session}}=await supabase.auth.getSession();if(!session){q('loginWarning').classList.remove('hidden');return}"
          replacement="async function boot(){const{data:{session}}=await supabase.auth.getSession();if(!session){q('loginWarning').classList.remove('hidden');return}const{data:accessProfile}=await supabase.from('profiles').select('is_blocked,role').eq('id',session.user.id).single();if(accessProfile?.is_blocked&&accessProfile?.role!=='admin'){alert('Tvoj KOLOS nalog je trenutno blokiran.');await supabase.auth.signOut();location.href='login.html';return}"
          if marker in s and 'Tvoj KOLOS nalog je trenutno blokiran.' not in s:
              s=s.replace(marker,replacement,1)

          p.write_text(s)
          PY
      - name: Commit questionnaire fix
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add questionnaire.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix KOLOS questionnaire completion flow"
          git push
