name: Sync rank insignias

on:
  push:
    paths:
      - '.github/workflows/sync-rank-insignias.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update landing rank insignias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          landing_fn = r'''function svgInsignia(type,high){
          const palettes={
            initiate:['#f2f4f6','#aab1b8','#343a40'],
            vanguard:['#d8ecff','#67a7ff','#173e78'],
            warrior:['#ffd2c6','#ff8068','#7f3022'],
            titan:['#eadcff','#a86bff','#3a235d'],
            kolos:['#efffb2','#b9ea38','#40540d'],
            dominus:['#fff0b6','#f0c54b','#664b10']
          };
          const p=palettes[type]||palettes.initiate;
          const id='rk_'+type+'_'+(high?'h':'l');
          const sigils={
            initiate:'<path d="M46 40h28v8H46zM50 54h20v8H50z"/>',
            vanguard:'<path d="M60 34 77 50 60 66 43 50z"/><path d="M60 42v16M52 50h16"/>',
            warrior:'<path d="M47 39 73 65M73 39 47 65"/><path d="m44 36 8 2-6 6zM76 36l-8 2 6 6z"/>',
            titan:'<path d="M42 38h36l-5 11H66v22H54V49h-7z"/>',
            kolos:'<path d="M60 34v34M60 50l13-10M60 50l13 11M60 50 48 40M60 50 47 61"/>',
            dominus:'<path d="m60 34 6 13 14 1-11 9 4 14-13-8-13 8 4-14-11-9 14-1z"/>'
          };
          const extra=high?'<path d="M42 28 51 20 60 28 69 20 78 28 75 36H45z"/><path d="M60 16 66 24 60 32 54 24z"/>':'<path d="M48 29h24l-4 7H52z"/>';
          return '<svg viewBox="0 0 120 104" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+
            '<defs><linearGradient id="'+id+'g" x1="30" y1="18" x2="88" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="'+p[0]+'"/><stop offset=".48" stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[2]+'"/></linearGradient><linearGradient id="'+id+'d" x1="28" y1="22" x2="88" y2="92" gradientUnits="userSpaceOnUse"><stop stop-color="#20242a"/><stop offset="1" stop-color="#0d1014"/></linearGradient></defs>'+
            '<g stroke="#15191d" stroke-width="3.6" stroke-linejoin="round">'+
              '<path d="M60 8 94 28 88 73 60 96 32 73 26 28z" fill="url(#'+id+'d)"/>'+
              '<path d="M60 13 88 30 82 68 60 88 38 68 32 30z" fill="url(#'+id+'g)"/>'+
              '<path d="M60 20 80 33 75 63 60 79 45 63 40 33z" fill="#15191d"/>'+
              '<path d="M35 35 46 29 48 39 39 46zM85 35 74 29 72 39 81 46z" fill="'+p[1]+'"/>'+
              '<path d="M39 68 49 73 60 83 71 73 81 68 78 78 60 91 42 78z" fill="'+p[2]+'"/>'+
              '<g fill="url(#'+id+'g)">'+extra+'</g>'+
              '<g fill="url(#'+id+'g)" stroke-width="3">'+sigils[type]+'</g>'+
            '</g>'+
            '<path d="M42 33 60 22 78 33" fill="none" stroke="'+p[0]+'" stroke-width="1.5" opacity=".9"/>'+
            '<path d="M44 67 60 81 76 67" fill="none" stroke="'+p[0]+'" stroke-width="1.2" opacity=".7"/>'+
          '</svg>';
          }'''

          p=Path('index.html')
          s=p.read_text()
          ns,n=re.subn(r"function svgInsignia\(type,high\)\{.*?\}\nfunction renderLandingRanks",landing_fn+'\nfunction renderLandingRanks',s,flags=re.S)
          if n!=1:
              raise SystemExit(f'index svg replacement count={n}')
          p.write_text(ns)
          PY
      - name: Commit landing insignias
        shell: bash
        run: |
          git config user.name "KOLOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine KOLOS rank badges with contained crest geometry"
          git push
